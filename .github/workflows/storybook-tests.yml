name: Storybook UI Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      - name: Run shared-ui tests
        shell: bash
        run: |
          npx nx run shared-ui:static:storybook --port=4400 &
          storybook_pid=$!
          trap 'kill "$storybook_pid"' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4400 > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Storybook did not become ready on port 4400"
              exit 1
            fi

            sleep 1
          done

          npx nx run shared-ui:test:storybook --coverage --url http://127.0.0.1:4400
